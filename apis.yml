aid: prophecyio
name: Prophecy.io
description: >-
  Prophecy is an AI-native, low-code data engineering and analytics platform for
  building, running, and managing data pipelines across SQL and Apache Spark
  environments on Databricks, Snowflake, and BigQuery. Data teams compose
  pipelines visually with gems (or natural language via the AI Copilot), and
  Prophecy generates clean Spark/SQL code committed to Git. The platform exposes
  a REST API (the Prophecy Orchestration/Deployment API) for programmatically
  managing fabrics, connections, secrets, deploying projects, and triggering
  pipeline runs and data tests, authenticated with per-user Personal Access
  Tokens. A companion CLI, the Prophecy Build Tool (PBT), integrates Prophecy
  projects into external CI/CD such as GitHub Actions and Jenkins.
